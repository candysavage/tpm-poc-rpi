# SLB9670 TPM over bit-banged SPI (mainline U-Boot has no BCM2711 hardware
# SPI0 controller driver), plus U-Boot's built-in measured-boot framework.
# Measures bootargs into PCR 1 and the kernel image into PCR 8 on every
# boot, no custom boot-script needed. Devicetree measurement (PCR 0) is
# deliberately disabled — see CONFIG_MEASURE_IGNORE_LOG's comment below.
CONFIG_SPI=y
CONFIG_DM_SPI=y
CONFIG_SOFT_SPI=y
CONFIG_TPM=y
CONFIG_TPM_V2=y
CONFIG_TPM2_TIS_SPI=y
CONFIG_CMD_TPM=y
CONFIG_CMD_TPM_V2=y

# Manual TPM debugging at the U-Boot prompt (tpm2 init/pcr_read/etc, hash cmd)
CONFIG_CMD_HASH=y
CONFIG_SHA256=y

# Built-in measured boot: hashes bootargs/kernel image into the TPM and an
# in-memory event log on every boot, without needing a custom boot script.
CONFIG_MEASURED_BOOT=y

# DIAGNOSED 2026-08-29 on real hardware: PCR 0/1/8 came out different on
# every single reboot of the exact same unchanged image — not the earlier
# "log too large" bug (already fixed), a genuinely different problem. Two
# distinct causes, both confirmed and both explicitly acknowledged in
# U-Boot's own Kconfig help text (boot/Kconfig):
#
# 1. PCR 0 (devicetree): the RPi firmware injects a fresh random
#    /chosen/kaslr-seed into the devicetree on every boot (used to
#    randomize kernel memory layout — confirmed present via
#    /sys/firmware/devicetree/base/chosen/kaslr-seed on the running
#    system). CONFIG_MEASURE_DEVICETREE hashes the whole DT blob
#    wholesale, so PCR 0 is non-deterministic by construction on any
#    platform that does this — which is exactly what MEASURE_DEVICETREE's
#    own help text warns about ("devicetree is not static as it may
#    contain random MAC addresses or other such data that changes each
#    boot... it should not be measured into the TPM"). Disabled rather
#    than worked around (e.g. stripping kaslr-seed via boot.scr before
#    measuring) — this is the officially-documented answer for this exact
#    scenario, not a limitation we're hiding. ARM64 Linux still gets KASLR
#    entropy from its own internal fallback when no DT seed is present, so
#    this doesn't fully disable kernel ASLR, just removes one entropy
#    source — worth stating plainly as a deliberate tradeoff, not silently.
#    NOTE: must be an explicit "is not set" line, not just omitted — its
#    Kconfig default is "y if MEASURED_BOOT", so simply removing a "=y"
#    line here doesn't disable it, same class of gotcha as
#    CONFIG_SYS_BOOTM_LEN's default earlier this session.
# CONFIG_MEASURE_DEVICETREE is not set
#
# 2. PCR 1/PCR 8: our event log scratch address (0x08000000, see the tpm
#    overlay's tpm_event_log_addr/size properties) is plain DRAM with
#    nothing clearing it between boots or resets. MEASURE_IGNORE_LOG's own
#    help text describes precisely this case ("platforms that use an event
#    log memory region that persists through system resets... should be
#    enabled to ignore any existing data") — without it, U-Boot may detect
#    apparent leftover log data from a previous boot and behave
#    differently depending on what it finds, producing inconsistent
#    extend sequences and hence different final PCR values across
#    otherwise-identical boots.
CONFIG_MEASURE_IGNORE_LOG=y

# CONFIG_MEASURED_BOOT's PCR 8 hashing only actually populates correctly
# under a FIT image + bootm (booti's raw-Image loader never fills in
# images->os.image_start/image_len — confirmed by testing, see local.conf's
# KERNEL_CLASSES/KERNEL_IMAGETYPE/KERNEL_BOOTCMD comment). That switch to
# fitImage+bootm needs U-Boot to actually understand FIT images, which the
# stock defconfig doesn't enable on its own (only CONFIG_LEGACY_IMAGE_FORMAT
# was set) — without this, bootm fails immediately with "Wrong Image Format
# for bootm command", confirmed on real hardware 2026-08-29.
CONFIG_FIT=y

# NOTE: CONFIG_SYS_BOOTM_LEN is deliberately NOT set in this fragment.
# meta-raspberrypi ships its own maxsize.cfg fragment (0x1000000, too small
# for our ~26.3MB kernel) that reliably merges after whatever we put here,
# silently winning regardless of layer priority or FILESEXTRAPATHS shadow
# attempts (both tried and failed, 2026-08-29). Forced instead via
# do_configure:append in the u-boot bbappend, after all fragment merging is
# done — see that comment for the full story.
