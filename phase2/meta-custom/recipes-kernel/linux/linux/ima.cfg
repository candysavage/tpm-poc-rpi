# IMA (kernel-side runtime measurement into PCR 10) — continues the measured
# boot chain past what U-Boot covers (PCR 1/8) into userspace.
#
# CONFIG_INTEGRITY/CONFIG_SECURITYFS are already =y in the stock defconfig
# (confirmed by reading the actual .config, 2026-08-29) — only CONFIG_IMA
# itself and its sub-options need adding. Verified against this exact
# kernel's own Kconfig (security/integrity/ima/Kconfig), not guessed:
#
# - CONFIG_IMA_MEASURE_PCR_IDX already defaults to 10 (range 8-14) — set
#   explicitly anyway for documentation clarity, matching this project's
#   convention of being explicit about deliberate choices.
# - CONFIG_IMA_DEFAULT_HASH_SHA1 is the kernel's own default — overridden to
#   SHA256 for consistency with every other PCR bank/quote used throughout
#   this project (Phase 1/2 all use sha256 exclusively).
# - CONFIG_IMA_APPRAISE deliberately NOT enabled — measurement only, no
#   enforcement, consistent with the project's "detect, don't enforce"
#   scope (matches the unsigned FIT/U-Boot decision).
# - CONFIG_IMA_WRITE_POLICY/READ_POLICY: not strictly required (the actual
#   policy is loaded via the "tcb" builtin at boot via the ima_policy=
#   kernel command-line parameter — see local.conf's CMDLINE:append — which
#   needs no userspace loading step, sidestepping meta-integrity's stock
#   systemd-based policy-loading service that this busybox-init image
#   doesn't have). Enabled anyway so the active policy can be inspected
#   (`cat /sys/kernel/security/ima/policy`) for verification/demo purposes.
CONFIG_IMA=y
CONFIG_IMA_MEASURE_PCR_IDX=10
CONFIG_IMA_DEFAULT_HASH_SHA256=y
CONFIG_IMA_WRITE_POLICY=y
CONFIG_IMA_READ_POLICY=y
