# Force TPM core + SPI TPM + SPI controller drivers builtin (not modules).
# Stock defconfig ships these as =m; measured boot needs the TPM registered
# before rootfs/module-loading infrastructure runs.
CONFIG_TCG_TPM=y
CONFIG_TCG_TIS_CORE=y
CONFIG_TCG_TIS_SPI=y
CONFIG_SPI=y
CONFIG_SPI_BCM2835=y

# The Xenon SLB9670 TPM is reached via bit-banged spi-gpio (tpm-slb9670-spi-gpio
# overlay), not the hardware spi0 controller, because U-Boot has no hardware
# BCM2711 SPI0 driver. Needs to be builtin for the same early-registration
# reason as the rest of this fragment.
CONFIG_SPI_GPIO=y

# Keep the Phase 1/2 I2C TPM path builtin too, wired in parallel for comparison.
CONFIG_TCG_TIS_I2C=y
